services:
  api:
    build: ./DEV/app/backend
    container_name: lettyquest-api
    environment:
      - APP_ENV=local
      - DATABASE_URL=sqlite:///./data/app.sqlite3  # <--- MUDAR AQUI
    ports:
      - "8000:8000"
    volumes:
      - ./DEV/app/backend/data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000